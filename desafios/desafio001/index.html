<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML5</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li><abbr title="Use a tag <p> - </p>">Parágrafos</abbr></li>
        <li><abbr title="Use a tag <h1> - </h1>">Títulos</abbr></li>
        <li><abbr title="Use a tag <img>">Imagens</abbr></li>
        <li><abbr title="Use a tag <abbr> - </abbr>">Abreviações</abbr></li>
        <li><abbr title="Use a tag <code> - </code>">Código-fonte</abbr></li>
        <li><abbr title="Use a tag <ol> - <li>">Listas númerada</abbr></li>
        <li><abbr title="Use a tag <ul> - <li>">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
