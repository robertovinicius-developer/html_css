<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas.</title>
    <style>
        h1{
            height: 300px;
            width: 300px;

            border: 10px solid black;

            padding: 10px;
            
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        a{
            border-width: 5px;
            border-style: solid;
            border-color: black;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level.</h1>
    <p>Paragráfos também são exemplos de box-level, mas o <a href="#">os links são exemplos de caixas inline-level</a>. Vamos ver como tudo funciona.</p>
</body>
</html>
