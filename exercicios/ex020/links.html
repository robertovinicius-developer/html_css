<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bolder;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:active{
            color: brown
        }

        .trampo::before{
            content:  ' ⇒ ';
            text-decoration: none;
            font-weight: normal;
            color: black;
        }

        .trampo::after{
            content: ' ⇐ ';
            text-decoration: none;
            font-weight: normal;
            color: black;
        }

        .trampo{
            background-color: brown;
        } 
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li class="trampo"><a href="https://github.com/robertovinicius-developer" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://youtube.com/@robertovinicius_071?si=txNT1CmxVAWphsbG" target="_blank">Canal no YouTube</a></li>
        <li><a href="https://www.instagram.com/robertovinicius_071/?__pwa=1" target>Instagram</a></li>
    </ul>
</body>
</html>
