<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        /* Configurações globais das CSS */
        * {
            height: 100%;
        }
        /* Corpo do site */
        body {
            background-image: radial-gradient(circle,#9FA3D6, #9FB5D6, #9EC6D6, #9FD6C1);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
</body>
</html>
